[pytest]
# Anchors the pytest rootdir at the repository root. Without a config file
# here pytest picks the first pyproject.toml it finds above a test folder,
# which is one of the package folders. A pyproject.toml in the repository
# root cannot be used instead, because the build system would then discover
# the root as a fourth package folder to build.
#
# examples/src and custom_build_tools/src hold Python code that is not
# installed into the venv, so their tests need them on sys.path.
pythonpath =
    examples/src
    custom_build_tools/src
# focus_sensitive marks tests that need a real display and are disturbed by
# any other activity that changes which window has the keyboard focus. The
# build deselects them through BuildSpec.excluded_test_markers, so they never
# show up as skipped. Run them manually with: pytest -m focus_sensitive
markers =
    focus_sensitive: needs an undisturbed real display; run manually
