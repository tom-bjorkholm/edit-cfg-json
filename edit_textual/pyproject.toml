[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "edit-cfg-json-textual"
authors = [
  { name="Tom Björkholm", email="klausuler_linnet0q@icloud.com" },
]
description = "Library for editing config-as-json with textual."
readme = "README_pypi.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "edit", "configuration", "JSON", "validation", "textual"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dynamic = ["dependencies", "version"]

[project.scripts]
edit-cfg-json-textual = "edit_cfg_json_textual.__main__:main"

[project.urls]
"Homepage" = "https://github.com/tom-bjorkholm/edit-cfg-json"
"Source code" = "https://github.com/tom-bjorkholm/edit-cfg-json"
"Documentation" = "https://github.com/tom-bjorkholm/edit-cfg-json/blob/master/doc/"
